# XcodeGen spec for Cue. The generated Cue.xcodeproj is committed so the project
# opens in Xcode with nothing to install. After editing this file, regenerate with
#   xcodegen generate
# CI fails if the committed project and this spec drift apart (see .github/workflows/ci.yml).
name: Cue
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"
  groupSortPosition: top
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  CueCore:
    path: Packages/CueCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(CUE_TEAM_ID)
    MARKETING_VERSION: $(CUE_VERSION)
    CURRENT_PROJECT_VERSION: $(CUE_BUILD)
targets:
  Cue:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: CueCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets the prompter run at 120 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Cue uses the camera to record takes while you read. Video stays on this device.
        NSMicrophoneUsageDescription: Cue listens so the script can follow your voice, and records sound with your takes. Audio stays on this device.
        NSSpeechRecognitionUsageDescription: Cue matches your words to the script using speech recognition on this device.
        NSPhotoLibraryAddUsageDescription: Cue saves takes to Photos only when you choose Export.
        CueCloudKitContainer: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.rtf
              - net.daringfireball.markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUE_BUNDLE_ID)
        PRODUCT_NAME: Cue
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  CueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Cue
      - package: CueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Cue.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Cue
        BUNDLE_LOADER: $(TEST_HOST)
  CueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Cue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CUE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cue
schemes:
  Cue:
    build:
      targets:
        Cue: all
        CueTests: [test]
        CueUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: CueTests
          parallelizable: false
        - name: CueUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
